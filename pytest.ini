# Repository-root config. Its only job is to pin pytest's rootdir here so that
# conftest.py at this level is always loaded as an initial conftest -- which is
# what lets the multi-project collection guard fire before any test module is
# imported. Each project under fde-assessment/ has its own pytest.ini, which
# takes precedence when you run pytest from inside that project.
[pytest]
addopts = -q
